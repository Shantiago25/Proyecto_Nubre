<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa de ayuda</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="encabezado">
    <h1>Mesa de ayuda del laboratorio</h1>
    <nav>
      <a href="/" class="{{ 'activo' if request.path == '/' }}">Registrar solicitud</a>

    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <p class="pie">Mesa de ayuda · Proyecto de Computación en la nube</p>
</body>
</html>
